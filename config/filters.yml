# 过滤规则：关键词黑名单与白名单
# 黑名单命中 → 直接丢弃；白名单用于豁免（如含"荐股"但属监管通报）

blacklist:
  - 荐股
  - 涨停预测
  - 牛股推荐
  - 加微信
  - 扫码进群
  - 免费领取
  - 点击领取
  - 独家内幕
  - 稳赚
  - 带你炒股

# 白名单：标题含这些词时即使命中黑名单也保留
whitelist:
  - 监管
  - 处罚
  - 立案
  - 证监会

# 正文长度门槛（字符）
min_length:
  drop_below: 60        # 低于此值且摘要也短 → 丢弃
  thin_below: 200       # 低于此值标记 thin（正文单薄，仅标题+摘要可用）

# 去重阈值
dedupe:
  title_similarity: 0.82   # 标题相似度阈值（0-1）
  token_jaccard: 0.70      # 词集 Jaccard 阈值
  window_days: 7           # 只与近 N 天的条目比对
